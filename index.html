<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='75'>👷</text></svg>" />
    <title>Happy Labour Day</title>
	<link rel="stylesheet" href="./css/style.css">
	<link rel="stylesheet" href="./css/fonts.css">
</head>

<body>
	<div class="efeito">
		<div class="line"> </div>
		<video src="resources/video.mp4" autoplay loop muted></video>
		<div class="logo">
			<div class="box">
				<img src="./resources/logo-labour.png" alt="Logo de Phpeitor">
			</div>
		</div>
		<img id="worker-fist" class="worker-fist" src="resources/main.png" alt="Puño de trabajador" />
		<h1 id="mensaje" class="mensaje">
			<span class="title-main shine-effect" aria-label="Feliz dia del Trabajador">
				<span class="word">Feliz día</span>
				<span class="word">del Trabajador</span>
			</span>
			<small id="dedicatoria" class="dedicatoria"><span id="cursor-dedicatoria" class="cursor-blink"></span></small>
			<button id="actualizar-nombre" class="actualizar-nombre" type="button">Actualizar</button>
			<div class="frase-container">
				<span id="frase-rotativa" class="frase-rotativa" aria-live="polite"></span>
				<div class="progress-bar" id="progress-bar"></div>
			</div>
		</h1>
		<form id="nombre-form" class="nombre-form" autocomplete="off">
			<input id="nombre-input" type="text" name="nombre" placeholder="Ingresa tu nombre" maxlength="50" required>
			<button type="submit">Generar</button>
		</form>
	</div>
	<script src="./js/main.js" defer></script>
</body>
</html>
